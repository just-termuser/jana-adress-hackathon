[project]
name = "jana-extract"
version = "0.1.0"
description = "Jana Post × Terricon Valley: извлечение полей из адреса без нормализации"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-m 'not perf'"
markers = ["perf: замер производительности"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.flake8-bugbear]
# Body/Query/File в аргументах по умолчанию — штатная идиома FastAPI.
extend-immutable-calls = ["fastapi.Body", "fastapi.Query", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
# Отчётные инструменты: строки markdown-таблиц и консольного вывода.
"tools/diagnose.py" = ["E501"]
"tools/eval.py" = ["E501"]
